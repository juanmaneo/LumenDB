[package]
name = "flashkv"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "High-performance LSM-tree KV store: LevelDB-style LSM+WAL, crash-safe pread reads (no mmap), FoundationDB-style group commit, MVCC snapshots and transactions"

[lints.rust]
# `cargo kani` builds every crate with `--cfg kani`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]
parking_lot = "0.12"
