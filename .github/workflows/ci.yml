name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  dev-check:
    name: fmt, clippy, tests, 100% coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo xtask dev-check
        run: cargo xtask dev-check

  kani:
    name: kani proofs
    runs-on: ubuntu-latest
    env:
      # Pinned: bump it on purpose, after running `cargo xtask kani` locally.
      KANI_VERSION: 0.68.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the kani release bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/kani
          key: kani-bundle-${{ runner.os }}-${{ env.KANI_VERSION }}
      - name: Install kani (the download is retried)
        run: sh .github/scripts/install-kani.sh
      - name: cargo xtask kani
        run: cargo xtask kani

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
