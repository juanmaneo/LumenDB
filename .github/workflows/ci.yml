name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  dev-check:
    name: fmt, clippy, tests, 100% coverage
    runs-on: ubuntu-latest
    env:
      # Nobody debugs a CI build: without debuginfo it compiles and caches less.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo xtask dev-check
        run: cargo xtask dev-check

  kani:
    name: kani proofs
    runs-on: ubuntu-latest
    env:
      # Pinned: bump it on purpose, after running `cargo xtask kani` locally.
      KANI_VERSION: 0.68.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache the kani release bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/kani
          key: kani-bundle-${{ runner.os }}-${{ env.KANI_VERSION }}
      - name: Install kani (the download is retried)
        run: sh .github/scripts/install-kani.sh
      - name: cargo xtask kani
        run: cargo xtask kani

  msrv:
    name: tests on the oldest Rust supported (rust-version)
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      # Keep in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace

  aarch64:
    name: aarch64 (clippy, tests, CRC32C speed)
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # (every failing test is listed, not only those of the first binary)
      - run: cargo test --workspace --no-fail-fast
      - name: CRC32C speed on this runner
        run: cargo run --release -p lumen-bench -- crc-bench --size 512 --size 4096 --size 65536 --size 1048576 --mb 1024
